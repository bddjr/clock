<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="only dark">
<title>时钟</title>
<link rel="preload" as="font" type="font/woff2"
      href="./fonts/HarmonyOS_Sans_SC_Regular-subset.woff2" crossorigin>
<style>
  @font-face {
    font-family: "HarmonyOS Sans SC";
    src: url("./fonts/HarmonyOS_Sans_SC_Regular-subset.woff2") format("woff2");
  }

  :root {
    color-scheme: dark;
    /* only：明确禁止内核/系统再做自动反色、提亮（QQ 内置 X5 会篡改 SVG 深色） */
    color-scheme: only dark;
    --red: #ef4444;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* safe center：内容放不下时自动退回“顶部对齐+可滚动”，避免顶部被裁掉 */
    justify-content: safe center;
    overflow: auto;
    gap: clamp(10px, 2.6vh, 26px);
    padding: clamp(10px, 2.5vh, 32px) clamp(10px, 4vw, 32px);
    background: black;
    font-family: "HarmonyOS Sans SC", system-ui;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ===== 上方：钟表 ===== */
  .clock {
    /* clamp(下限, 首选值, 上限)：视口再小，时钟也保底 170px，不会缩没 */
    width: clamp(170px, min(85vw, 58vh), 460px);
    flex-shrink: 0;
    forced-color-adjust: none;   /* 拒绝系统强制配色改写本 SVG */
  }

  .hand {
    stroke-linecap: round;
  }

  /* 全部用 hex，避开老内核对现代 hsl() 的解析差异 */
  #hourHand   { stroke: #dbdbdb;   stroke-width: 6.5; }
  #minuteHand { stroke: #dbdbdb;   stroke-width: 4.5; }
  #secondHand { stroke: var(--red); stroke-width: 2.5; }

  /* ===== 下方：时间 ===== */
  .time {
    font-size: clamp(30px, 11vmin, 68px);
    letter-spacing: 0.04em;
    color: white;
    line-height: 1;
    white-space: nowrap;
  }

  .time, .clock {
    /* HarmonyOS Sans 的「等宽时钟数字」是 ss01 这套独立字形，
       系统时钟用的正是它（华为 TextClock 文档：fontFeature '"ss01" on'）。
       ss01 自带等宽字形 + 专用时钟冒号，故不再用普通的 tnum。 */
    -webkit-font-feature-settings: "ss01" 1;
    font-feature-settings: "ss01" 1;
    font-variant-numeric: normal;
  }

  .date {
    font-size: clamp(15px, 3.6vmin, 21px);
    color: #bbb;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
</style>
</head>
<body>

  <!-- ============ 上方：钟表 ============ -->
  <svg class="clock" viewBox="0 0 300 300" role="img" aria-label="模拟时钟">
    <!-- 表盘不写深色值：用「白色 + 低透明度」叠在黑底上得到深灰 #0d0d0d。
         QQ 安卓 X5 的强制暗色会把 SVG 里的深色一律提亮成 #a0a0a0，
         写成白色半透明后它便无从篡改，同时保持原视觉。 -->
    <circle cx="150" cy="150" r="145" fill="#ffffff" fill-opacity="0.05" />
    <circle cx="150" cy="150" r="145" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5" />
    <g id="ticks"></g>
    <g id="numbers"></g>
    <circle cx="150" cy="150" r="7" fill="#dbdbdb" />
    <g id="hands">
      <line id="hourHand"   class="hand" x1="150" y1="150" x2="150" y2="70" />
      <line id="minuteHand" class="hand" x1="150" y1="150" x2="150" y2="38" />
      <line id="secondHand" class="hand" x1="150" y1="162" x2="150" y2="28" />
    </g>
    <circle cx="150" cy="150" r="4" fill="#ef4444" />
  </svg>

  <!-- ============ 下方：时间 ============ -->
  <div class="time" id="time">00:00:00</div>
  <div class="date" id="date">1970年1月1日 星期四</div>

<script>
{
  const NS = 'http://www.w3.org/2000/svg';
  const CX = 150, CY = 150;

  const ticksG   = document.getElementById('ticks');
  const numbersG = document.getElementById('numbers');
  const hourHand   = document.getElementById('hourHand');
  const minuteHand = document.getElementById('minuteHand');
  const secondHand = document.getElementById('secondHand');
  const timeEl  = document.getElementById('time');
  const dateEl  = document.getElementById('date');

  /* ---------- 1. 生成刻度 ---------- */
  for (let i = 0; i < 60; i++) {
    const major = i % 5 === 0;
    const rad = (i * 6) * Math.PI / 180;
    const rInner = major ? 128 : 132;
    const rOuter = 138;

    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', CX + Math.sin(rad) * rInner);
    line.setAttribute('y1', CY - Math.cos(rad) * rInner);
    line.setAttribute('x2', CX + Math.sin(rad) * rOuter);
    line.setAttribute('y2', CY - Math.cos(rad) * rOuter);
    /* 刻度同样用「白色 + 透明度」表达深灰，不给强制暗色留深色可改 */
    line.setAttribute('stroke', '#ffffff');
    line.setAttribute('stroke-opacity', major ? '0.34' : '0.18');
    line.setAttribute('stroke-width', major ? '4.5' : '2.5');
    line.setAttribute('stroke-linecap', 'round');
    ticksG.appendChild(line);
  }

  /* ---------- 2. 生成 1~12 数字（半径 99 → 106，贴近刻度） ---------- */
  for (let n = 1; n <= 12; n++) {
    const rad = (n * 30) * Math.PI / 180;
    const r = 108;

    const text = document.createElementNS(NS, 'text');
    text.setAttribute('x', CX + Math.sin(rad) * r);
    text.setAttribute('y', CY - Math.cos(rad) * r);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'central');
    text.setAttribute('font-size', '20');
    text.setAttribute('fill', '#b3b3b3');
    text.textContent = n;
    numbersG.appendChild(text);
  }

  /* ---------- 3. 工具函数 ---------- */
  const pad2 = n => (n > 9 ? '' + n : '0' + n);
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

  /* ---------- 4. 渲染 ---------- */
  const render = (now) => {
    const h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();

    const secDeg  = s * 6;
    const minDeg  = (m + s / 60) * 6;
    const hourDeg = ((h % 12) + m / 60 + s / 3600) * 30;

    secondHand.setAttribute('transform', `rotate(${secDeg} ${CX} ${CY})`);
    minuteHand.setAttribute('transform', `rotate(${minDeg} ${CX} ${CY})`);
    hourHand  .setAttribute('transform', `rotate(${hourDeg} ${CX} ${CY})`);

    timeEl.innerText = `${pad2(h)}:${pad2(m)}:${pad2(s)}`;

    const dateText = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 星期${WEEK[now.getDay()]}`;
    if (dateEl.innerText !== dateText) dateEl.innerText = dateText;
  };

  /* ---------- 5. 核心：用 setTimeout 对齐到整秒 ---------- */
  let timeoutId;
  const tick = () => {
    if (timeoutId !== undefined) {
      clearTimeout(timeoutId);
      timeoutId = undefined;
    }
    if (document.hidden) return;
    const date = new Date();
    timeoutId = setTimeout(tick, 1001 - date.getMilliseconds());
    render(date);
  };

  /* ---------- 6. 启动 ---------- */
  tick();
  document.addEventListener('visibilitychange', tick);
}
</script>
</body>
</html>
